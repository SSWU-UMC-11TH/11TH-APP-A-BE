<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UMC Movie - Mock Frontend</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    code { background: #f3f3f3; padding: 2px 4px; border-radius: 4px; }
    input { padding: 6px 8px; width: 220px; }
    button { padding: 6px 12px; cursor: pointer; }
    pre { background: #111; color: #9f9; padding: 12px; border-radius: 6px; white-space: pre-wrap; min-height: 20px; }
    pre.error { color: #f88; }
  </style>
</head>
<body>
  <h1>🎬 UMC Movie - API 연결 테스트</h1>
  <p>Backend: <input id="base" value="http://localhost:8080" /></p>

  <section>
    <h2>닉네임 중복 체크 <code>GET /members/nickname/{nickname}</code></h2>
    <input id="nickname" value="수현" />
    <button onclick="call('/members/nickname/' + encodeURIComponent(v('nickname')), 'r1')">확인</button>
    <pre id="r1"></pre>
  </section>

  <section>
    <h2>이메일 중복 체크 <code>GET /members/email/{email}</code></h2>
    <input id="email" value="noco@umc.com" />
    <button onclick="call('/members/email/' + encodeURIComponent(v('email')), 'r2')">확인</button>
    <pre id="r2"></pre>
  </section>

  <section>
    <h2>유저별 평점 조회 <code>GET /members/{memberId}/ratings</code></h2>
    <input id="memberId" value="1" />
    <button onclick="call('/members/' + encodeURIComponent(v('memberId')) + '/ratings', 'r3')">조회</button>
    <pre id="r3"></pre>
  </section>

  <script>
    const v = (id) => document.getElementById(id).value.trim();

    async function call(path, outId) {
      const out = document.getElementById(outId);
      out.className = '';
      out.textContent = '요청 중...';
      const url = v('base') + path;
      try {
        const res = await fetch(url);
        const body = await res.json();
        out.className = res.ok ? '' : 'error';
        out.textContent = `GET ${url}\nstatus: ${res.status}\n\n` + JSON.stringify(body, null, 2);
      } catch (e) {
        // CORS로 막히면 브라우저가 응답을 넘겨주지 않아 여기로 들어옵니다. (자세한 내용은 F12 Console)
        out.className = 'error';
        out.textContent = `GET ${url}\n${e.name}: ${e.message}\n→ F12 Console 탭에서 CORS 에러를 확인하세요.`;
        console.error(e);
      }
    }
  </script>
</body>
</html>
